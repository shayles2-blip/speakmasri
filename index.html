<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpeakMasri — Learn Egyptian Arabic 🇪🇬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Cairo:wght@400;600;700&family=Amiri:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ===== DESIGN SYSTEM — warm, editorial, rooted in the subject (not a gamification-app palette) ===== */
:root{
  --ink:#2b2320; --ink-soft:#6e5f54; --paper:#faf5ee; --surface:#ffffff; --line:#e9decf;
  --teal:#12595c; --teal-deep:#0a3c3e; --teal-soft:#e2eeee;
  --clay:#c1633d; --clay-deep:#9c4c2e; --clay-soft:#f5e2d8;
  --gold:#b8863a; --gold-soft:#f4e8cb;
  --sage:#5c8368; --sage-soft:#e6efe6;
  --brick:#af4438; --brick-soft:#f6e2df;
  --r:14px; --r-lg:20px;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',-apple-system,sans-serif;}
body{background:var(--paper);color:var(--ink);}
.hidden{display:none!important;}
.app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--surface);
position:relative;padding-bottom:70px;box-shadow:0 0 60px rgba(43,35,32,.06);}
.ar{font-family:'Cairo','Tajawal',sans-serif;direction:rtl;unicode-bidi:isolate;}
h1,h2,.serif{font-family:'Fraunces',Georgia,serif;}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
.btn{background:var(--teal);color:#fff;border:none;border-radius:var(--r);
padding:15px 24px;font-weight:600;font-size:16px;letter-spacing:.01em;
box-shadow:0 1px 2px rgba(10,60,62,.15);cursor:pointer;width:100%;
transition:transform .12s ease,box-shadow .12s ease,opacity .12s ease;}
.btn:hover{box-shadow:0 3px 10px rgba(10,60,62,.22);}
.btn:active{transform:scale(.97);opacity:.92;}
.btn:disabled{background:#e3dccf;color:#a89b8c;box-shadow:none;cursor:not-allowed;transform:none;}
.btn-blue{background:var(--clay);box-shadow:0 1px 2px rgba(156,76,46,.2);}
.btn-blue:hover{box-shadow:0 3px 10px rgba(156,76,46,.25);}
.btn-ghost{background:transparent;color:var(--teal);border:1.5px solid var(--line);box-shadow:none;}
.btn-ghost:hover{background:var(--teal-soft);}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;
border-bottom:1px solid var(--line);font-weight:600;}
.stat{display:flex;gap:6px;align-items:center;font-size:16px;color:var(--ink-soft);}
input,select{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:var(--r);
font-size:16px;margin:8px 0;background:var(--surface);color:var(--ink);}
input:focus,select:focus{outline:none;border-color:var(--teal);}
h1{font-size:30px;margin:16px;font-weight:600;}
h2{margin:20px 20px 8px;font-size:22px;font-weight:600;}
.center{text-align:center;padding:24px;}
.logo{font-size:44px;text-align:center;margin-top:36px;}
.brand{color:var(--teal-deep);font-weight:600;font-size:30px;text-align:center;font-family:'Fraunces',serif;}
/* Scenario list */
.scenario-card{margin:14px 16px;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface);}
.scenario-head{display:flex;align-items:center;gap:12px;padding:16px 18px;background:var(--teal-soft);}
.scenario-icon{font-size:22px;}
.scenario-title{font-family:'Fraunces',serif;font-weight:600;font-size:17px;color:var(--teal-deep);flex:1;}
.scenario-progress{font-size:12px;color:var(--ink-soft);font-weight:500;}
.lesson-row{display:flex;align-items:center;gap:12px;padding:14px 18px;border-top:1px solid var(--line);
cursor:pointer;background:none;border-left:none;border-right:none;border-bottom:none;width:100%;text-align:left;
transition:background .1s ease;}
.lesson-row:hover:not(:disabled){background:var(--paper);}
.lesson-row:disabled{cursor:not-allowed;color:#b8ab9c;}
.lesson-badge{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
font-size:14px;flex-shrink:0;background:var(--line);color:var(--ink-soft);}
.lesson-row.done .lesson-badge{background:var(--gold-soft);color:var(--gold);}
.lesson-row.unlocked .lesson-badge{background:var(--teal);color:#fff;}
.lesson-name{font-size:15px;font-weight:500;color:var(--ink);}
.lesson-row:disabled .lesson-name{color:#b8ab9c;}
/* Exercise */
.q{font-size:21px;font-weight:600;margin:24px 20px 10px;font-family:'Fraunces',serif;color:var(--ink);}
.opt{display:block;width:calc(100% - 32px);margin:8px 16px;padding:17px;
border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;
font-size:19px;text-align:center;transition:border-color .12s ease,background .12s ease;}
.opt.sel{border-color:var(--teal);background:var(--teal-soft);}
.opt.correct{border-color:var(--sage);background:var(--sage-soft);}
.opt.wrong{border-color:var(--brick);background:var(--brick-soft);}
.franco{color:var(--ink-soft);font-size:14px;}
.progbar{height:8px;background:var(--line);border-radius:8px;flex:1;margin:0 14px;overflow:hidden;}
.progfill{height:100%;background:var(--clay);border-radius:8px;transition:.3s;}
#lesson{padding-bottom:96px;}
#checkWrap{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;
padding:16px 20px;padding-bottom:calc(16px + env(safe-area-inset-bottom));
background:var(--surface);border-top:1px solid var(--line);z-index:6;}
.feedback{position:fixed;bottom:80px;left:0;right:0;max-width:480px;margin:0 auto;
padding:20px;border-top-left-radius:var(--r-lg);border-top-right-radius:var(--r-lg);z-index:5;}
.fb-ok{background:var(--sage-soft);}.fb-no{background:var(--brick-soft);}
.fb-title{font-weight:600;font-size:19px;margin-bottom:6px;font-family:'Fraunces',serif;}
.match-cols{display:flex;gap:12px;padding:16px 20px;}
.match-col{flex:1;display:flex;flex-direction:column;gap:10px;}
/* Nav */
.nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;
display:flex;background:var(--surface);border-top:1px solid var(--line);
padding-bottom:env(safe-area-inset-bottom);}
.nav button{flex:1;background:none;border:none;padding:14px;font-size:22px;cursor:pointer;
border-top:2px solid transparent;opacity:.55;transition:opacity .12s ease;}
.nav button.active{border-top-color:var(--clay);opacity:1;}
.confetti{font-size:56px;text-align:center;margin:20px;}
.audio-btn{background:var(--clay);width:72px;height:72px;border-radius:50%;font-size:28px;
color:#fff;border:none;box-shadow:0 2px 8px rgba(156,76,46,.25);cursor:pointer;margin:16px auto;display:block;
transition:transform .12s ease;}
.audio-btn:active{transform:scale(.94);}
.audio-btn:disabled{background:#d8cfc2;box-shadow:none;cursor:not-allowed;}
.fillwrap{padding:16px 20px;}
.fillwrap input{font-size:19px;text-align:center;}
#auth,#main,#lesson,#done{animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div class="app">
  <!-- AUTH -->
  <div id="auth" class="center">
    <div class="logo">🫖</div>
    <div class="brand">SpeakMasri</div>
    <p style="color:var(--ink-soft);margin:8px 0 24px">Learn <b>Egyptian Arabic</b> 🇪🇬 the way locals really speak</p>
    <input id="name" placeholder="Name (for signup)" autocomplete="name">
    <input id="email" placeholder="Email" type="email" autocomplete="email">
    <input id="pass" placeholder="Password" type="password" autocomplete="current-password">
    <select id="motivation">
      <option value="">Why are you learning? (for signup)</option>
      <option value="partner">Egyptian partner / in-laws</option>
      <option value="traveler">Upcoming trip to Egypt</option>
      <option value="heritage">Reconnecting with heritage</option>
      <option value="other">Other</option>
    </select>
    <div id="authErr" role="alert" style="color:var(--brick);font-weight:600;margin:8px 0"></div>
    <button class="btn" onclick="signup()">Sign Up</button>
    <div style="height:10px"></div>
    <button class="btn btn-ghost" onclick="login()">Log In</button>
    <div style="height:16px"></div>
    <button class="btn btn-ghost" style="border-style:dashed" onclick="startGuestLesson()">Try a Lesson First (No Account)</button>
  </div>

  <!-- MAIN -->
  <div id="main" class="hidden">
    <div class="top">
      <div class="stat">💬 <span id="milestoneCount">0</span> said</div>
      <div class="stat" style="color:var(--gold)">⭐ <span id="xp">0</span></div>
    </div>
    <!-- LEARN -->
    <div id="learn"></div>
    <!-- PHRASEBOOK -->
    <div id="phrasebook" class="hidden">
      <h2>📖 Phrasebook</h2>
      <p style="padding:0 16px 12px;color:var(--ink-soft)">Everything you've unlocked so far — pull this up mid-conversation.</p>
      <div id="pbList"></div>
    </div>
    <!-- PROFILE -->
    <div id="profile" class="hidden center">
      <div class="logo">🫖</div>
      <h2 id="pName"></h2>
      <p style="color:var(--ink-soft)" id="pEmail"></p>
      <div style="display:flex;justify-content:space-around;margin:24px 0">
        <div><div style="font-size:28px;font-weight:600;font-family:'Fraunces',serif;color:var(--gold)" id="pXp">0</div>Total XP</div>
        <div><div style="font-size:28px;font-weight:600;font-family:'Fraunces',serif;color:var(--sage)" id="pMilestones">0</div>Phrases Said</div>
      </div>
      <div style="text-align:left;padding:0 16px">
        <div style="font-weight:800;margin-bottom:8px">Your moments</div>
        <div id="milestoneLog" style="color:var(--ink-soft);font-size:14px"></div>
      </div>
      <div style="height:16px"></div>
      <button class="btn btn-ghost" onclick="logout()">Log Out</button>
    </div>
    <div class="nav">
      <button class="active" id="nLearn" onclick="tab('learn')" aria-label="Learn">🏠</button>
      <button id="nPhrasebook" onclick="tab('phrasebook')" aria-label="Phrasebook">📖</button>
      <button id="nProfile" onclick="tab('profile')" aria-label="Profile">👤</button>
    </div>
  </div>

  <!-- LESSON -->
  <div id="lesson" class="hidden">
    <div class="top">
      <button onclick="quitLesson()" aria-label="Quit lesson" style="background:none;border:none;font-size:24px;cursor:pointer;padding:10px;min-width:44px;min-height:44px">✕</button>
      <div class="progbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progbarEl"><div class="progfill" id="prog"></div></div>
    </div>
    <div id="exArea"></div>
    <div id="fbArea" aria-live="polite"></div>
    <div id="checkWrap"><button class="btn" id="checkBtn" onclick="check()" disabled>Check</button></div>
  </div>

  <!-- COMPLETE -->
  <div id="done" class="hidden center">
    <div class="confetti">🎉</div>
    <h1 id="doneTitle">Lesson Complete!</h1>
    <div style="display:flex;justify-content:space-around;margin:24px 0">
      <div style="background:var(--gold-soft);padding:16px;border-radius:var(--r-lg);border:1.5px solid var(--gold)">
        <div style="font-size:22px;font-weight:600;font-family:'Fraunces',serif;color:var(--gold)" id="dXp">+10</div>XP Earned</div>
      <div style="background:var(--teal-soft);padding:16px;border-radius:var(--r-lg);border:1.5px solid var(--teal)">
        <div style="font-size:22px;font-weight:600;font-family:'Fraunces',serif;color:var(--teal)" id="dAcc">100%</div>Accuracy</div>
    </div>
    <div id="missionBox" style="background:var(--clay-soft);border:1.5px dashed var(--clay);border-radius:var(--r-lg);margin:16px;padding:16px;text-align:left"></div>
    <div style="padding:0 16px"><button class="btn" onclick="finishLesson()">Continue</button></div>
  </div>
</div>

<script>
/* ===== AGENT 5: NATIVE EGYPTIAN CONTENT — scenario-based (partner/in-laws journey) ===== */
const COURSE={units:[
 {id:"u0",title:"Everyday Basics أساسيات يومية",lessons:[
  {id:"l3-1",title:"Yes, No & Common",xp:10,vocab:[
   {en:"Yes",ar:"أيوة",franco:"Aywa"},
   {en:"No",ar:"لأ",franco:"La'"},
   {en:"Let's go / Come on",ar:"يلا",franco:"Yalla"},
   {en:"Finished / Enough / OK",ar:"خلاص",franco:"Khalas"},
   {en:"God willing",ar:"إن شاء الله",franco:"Inshallah"}
  ]}
 ]},
 {id:"u1",title:"Scenario: Meeting Her Family for the First Time",lessons:[
  {id:"l1-1",title:"Hello & Hi",xp:10,vocab:[
   {en:"Hi (informal)",ar:"إزيك",franco:"Ezzayak"},
   {en:"Welcome / Hey",ar:"أهلاً",franco:"Ahlan"},
   {en:"Good morning",ar:"صباح الخير",franco:"Sabah el kheir"},
   {en:"Good evening",ar:"مساء الخير",franco:"Masa el kheir"},
   {en:"Goodbye",ar:"مع السلامة",franco:"Ma'a el salama"}
  ]},
  {id:"l1-2",title:"How are you?",xp:10,vocab:[
   {en:"How are you? (to a man)",ar:"عامل إيه",franco:"3amel eh"},
   {en:"I'm good, thank God",ar:"كويس الحمد لله",franco:"kwayyes el7amdulillah"},
   {en:"Fine / OK",ar:"تمام",franco:"Tamam"},
   {en:"Not good",ar:"مش كويس",franco:"Mesh kwayes"}
  ]},
  {id:"l2-1",title:"Please & Thanks",xp:10,vocab:[
   {en:"Thank you",ar:"شكراً",franco:"Shukran"},
   {en:"You're welcome",ar:"العفو",franco:"el-3afw"},
   {en:"Please (to a man)",ar:"لو سمحت",franco:"Law samaht"},
   {en:"Sorry / Excuse me",ar:"آسف",franco:"Asef"},
   {en:"Never mind / It's OK",ar:"معلش",franco:"Ma3lesh"}
  ]}
 ]},
 {id:"u2",title:"Scenario: Getting Close with Mom & Dad",lessons:[
  {id:"l2-2",title:"Family & Terms of Endearment",xp:10,vocab:[
   {en:"Darling / Sweetheart (to partner)",ar:"حبيبي / حبيبتي",franco:"7abibi / 7abibti"},
   {en:"Respectful way to address mother-in-law (like 'Mama')",ar:"ماما",franco:"mama"},
   {en:"Respectful way to address father-in-law (like 'Baba')",ar:"بابا",franco:"baba"},
   {en:"How Egyptians actually say 'I love you' (casual, natural)",ar:"باحبك",franco:"ba7ebak / ba7ebik"},
   {en:"Asking 'How is your family?' (as Egyptians say it)",ar:"العيلة عاملة إيه؟",franco:"el-3eela 3amla eh?"},
   {en:"Saying 'God keep them safe' (common after mentioning family)",ar:"الله يِخَلِّيهم",franco:"Allah y5alleehom"}
  ]}
 ]},
 {id:"u3",title:"Scenario: A Special Occasion (Eid & Celebrations)",lessons:[
  {id:"l3-2",title:"Eid & Family Gatherings",xp:10,vocab:[
   {en:"Eid greeting (to anyone)",ar:"كل سنة وانت طيب",franco:"kol sana w enta tayyeb"},
   {en:"Blessing/wish to elders",ar:"الله يخليك لنا",franco:"Allah yekhalleek lana"},
   {en:"Complimenting the host's cooking/hospitality",ar:"الأكل تحفة، تسلم إيدِك",franco:"el-akl tu7fa, teslam eedek"},
   {en:"Asking politely for more food",ar:"ممكن آخد زيادة شوية؟",franco:"momken akhod zeyada shwayya?"},
   {en:"Compliment about how nice everyone looks",ar:"كلكم شكلكم حلو أوي",franco:"kolkom sheklokom 7elw awi"},
   {en:"Offering to help (useful at family gatherings)",ar:"أساعد في إيه؟",franco:"asa3ed fi eh?"}
  ]}
 ]},
 {id:"u4",title:"Scenario: Out & About Together",lessons:[
  {id:"l4-1",title:"Counting 1–10 العدّ من واحد لعشرة",xp:10,vocab:[
   {en:"one",ar:"واحد",franco:"wa7ed"},
   {en:"two",ar:"اتنين",franco:"etnein"},
   {en:"three",ar:"تلاتة",franco:"talata"},
   {en:"five",ar:"خمسة",franco:"khamsa"},
   {en:"ten",ar:"عشرة",franco:"3ashra"}
  ]},
  {id:"l4-2",title:"How Much? بكام؟",xp:10,vocab:[
   {en:"How much is this?",ar:"بكام ده؟",franco:"bekam da?"},
   {en:"That's too expensive!",ar:"ده غالي أوي!",franco:"da ghali awi!"},
   {en:"Come on, make it a good price",ar:"يلا بقى، اعملهولي بسعر حلو",franco:"yalla ba2a, e3mholi bese3r 7elw"},
   {en:"Twenty pounds, final",ar:"عشرين جنيه وخلاص",franco:"3eshreen geneh w khalas"},
   {en:"Do you have change?",ar:"معاك فكة؟",franco:"ma3ak fakka?"}
  ]},
  {id:"l4-3",title:"Taxi & Fares التاكسي والأجرة",xp:10,vocab:[
   {en:"How much to downtown?",ar:"بكام لوسط البلد؟",franco:"bekam le west el balad?"},
   {en:"Turn on the meter, please",ar:"شغّل العدّاد لو سمحت",franco:"shaghal el 3addad law sama7t"},
   {en:"Stop here on the side",ar:"على جنب هنا",franco:"3ala gamb hena"},
   {en:"Keep the change",ar:"خلي الباقي ليك",franco:"khali el ba2i leek"},
   {en:"That's not the normal fare",ar:"دي مش الأجرة العادية",franco:"di mesh el ogra el 3adeya"}
  ]}
 ]},
 {id:"u5",title:"Scenario: Cooking & Eating Together",lessons:[
  {id:"l5-1",title:"At the Café على القهوة",xp:10,vocab:[
   {en:"A tea, please",ar:"شاي لو سمحت",franco:"shay law sama7t"},
   {en:"Coffee, medium sugar",ar:"قهوة مظبوط",franco:"ahwa mazboot"},
   {en:"Without sugar",ar:"سادة",franco:"sada"},
   {en:"A fresh mango juice",ar:"عصير مانجا فريش",franco:"3aseer manga fresh"},
   {en:"Waiter! (getting attention)",ar:"يا أسطى!",franco:"ya osta!"}
  ]},
  {id:"l5-2",title:"The Koshary Stand عند الكشري",xp:10,vocab:[
   {en:"One medium koshary",ar:"واحد كشري وسط",franco:"wa7ed koshari wasat"},
   {en:"Extra fried onions",ar:"تقلية زيادة",franco:"ta2leya zeyada"},
   {en:"Easy on the hot sauce",ar:"شطة خفيف",franco:"shatta khafeef"},
   {en:"Take away",ar:"تيك أواي",franco:"take away"},
   {en:"Eating in",ar:"هنا جوه",franco:"hena gowa"}
  ]},
  {id:"l5-3",title:"Ordering & Paying الطلب والحساب",xp:10,vocab:[
   {en:"What do you recommend?",ar:"ترشحلي إيه؟",franco:"torasha7li eh?"},
   {en:"I'd like this one",ar:"عايز ده",franco:"3ayez da"},
   {en:"No meat, I'm vegetarian",ar:"من غير لحمة، أنا مباكلش لحمة",franco:"men gheir la7ma, ana mabakolsh la7ma"},
   {en:"The bill, please",ar:"الحساب لو سمحت",franco:"el 7esab law sama7t"},
   {en:"It was really delicious",ar:"كان تحفة والله",franco:"kan to7fa wallahi"}
  ]}
 ]}
]};

/* ===== AGENT 6: APP STATE & LOGIC ===== */
let user=null;          // logged-in user object
let curLesson=null;     // lesson currently in progress
let exList=[];          // built exercises for current lesson
let exIdx=0;
let correctCount=0;
let selection=null;     // current selection for check()
let matchState=null;    // state for match exercise

function loadUsers(){return JSON.parse(localStorage.getItem("lm_users")||"[]");}
function saveUsers(u){localStorage.setItem("lm_users",JSON.stringify(u));}
function saveCurrent(email){localStorage.setItem("lm_current",email);}
function loadCurrentEmail(){return localStorage.getItem("lm_current");}
function saveUser(){
  const users=loadUsers();
  const i=users.findIndex(u=>u.email===user.email);
  if(i>=0)users[i]=user;
  saveUsers(users);
}

function allVocab(){
  const v=[];
  COURSE.units.forEach(u=>u.lessons.forEach(l=>v.push(...l.vocab)));
  return v;
}

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

/* ---------- AUTH ---------- */
function signup(){
  const name=document.getElementById("name").value.trim();
  const email=document.getElementById("email").value.trim().toLowerCase();
  const pass=document.getElementById("pass").value;
  const motivation=document.getElementById("motivation").value;
  const err=document.getElementById("authErr");
  err.textContent="";
  if(!name||!email||!pass){err.textContent="Fill in all fields to sign up.";return;}
  const users=loadUsers();
  if(users.find(u=>u.email===email)){err.textContent="That email is already registered — log in instead.";return;}
  const newUser={name,email,password:pass,motivation,xp:0,progress:{},milestones:[]};
  users.push(newUser);
  saveUsers(users);
  saveCurrent(email);
  user=newUser;
  enterApp();
}

function login(){
  const email=document.getElementById("email").value.trim().toLowerCase();
  const pass=document.getElementById("pass").value;
  const err=document.getElementById("authErr");
  err.textContent="";
  const users=loadUsers();
  const found=users.find(u=>u.email===email&&u.password===pass);
  if(!found){err.textContent="No matching account. Check email/password or sign up.";return;}
  user=found;
  saveCurrent(email);
  enterApp();
}

function startGuestLesson(){
  user={name:"Guest",email:null,isGuest:true,xp:0,progress:{},milestones:[]};
  startLesson(COURSE.units[0].lessons[0]);
}

function logout(){
  localStorage.removeItem("lm_current");
  user=null;
  document.getElementById("main").classList.add("hidden");
  document.getElementById("auth").classList.remove("hidden");
  document.getElementById("name").value="";
  document.getElementById("email").value="";
  document.getElementById("pass").value="";
}

function enterApp(){
  document.getElementById("auth").classList.add("hidden");
  document.getElementById("main").classList.remove("hidden");
  refreshTopBar();
  renderPath();
  tab("learn");
}

function refreshTopBar(){
  document.getElementById("milestoneCount").textContent=(user.milestones||[]).length;
  document.getElementById("xp").textContent=user.xp;
}

/* ---------- NAV ---------- */
function tab(name){
  ["learn","phrasebook","profile"].forEach(t=>{
    document.getElementById(t).classList.toggle("hidden",t!==name);
    document.getElementById("n"+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle("active",t===name);
  });
  if(name==="profile")renderProfile();
  if(name==="learn")renderPath();
  if(name==="phrasebook")renderPhrasebook();
}

/* ---------- LEARNING PATH ---------- */
function isLessonDone(id){return !!(user.progress[id]&&user.progress[id].done);}
function isLessonUnlocked(uIdx,lIdx){
  if(uIdx===0&&lIdx===0)return true;
  const flat=[];
  COURSE.units.forEach((u,ui)=>u.lessons.forEach((l,li)=>flat.push({ui,li,id:l.id})));
  const pos=flat.findIndex(f=>f.ui===uIdx&&f.li===lIdx);
  const prev=flat[pos-1];
  return prev?isLessonDone(prev.id):true;
}

const SCENARIO_ICONS={u0:"💬",u1:"🤝",u2:"❤️",u3:"🎉",u4:"🚕",u5:"🍲"};

function renderPath(){
  const el=document.getElementById("learn");
  el.innerHTML="";
  COURSE.units.forEach((u,ui)=>{
    const card=document.createElement("div");
    card.className="scenario-card";

    const doneCount=u.lessons.filter(l=>isLessonDone(l.id)).length;
    const head=document.createElement("div");
    head.className="scenario-head";
    head.innerHTML=`<span class="scenario-icon">${SCENARIO_ICONS[u.id]||"📍"}</span>
      <span class="scenario-title">${u.title.replace(/^Scenario:\s*/,"")}</span>
      <span class="scenario-progress">${doneCount}/${u.lessons.length}</span>`;
    card.appendChild(head);

    u.lessons.forEach((l,li)=>{
      const unlocked=isLessonUnlocked(ui,li);
      const done=isLessonDone(l.id);
      const row=document.createElement("button");
      row.className="lesson-row "+(done?"done":(unlocked?"unlocked":""));
      row.disabled=!unlocked;
      row.innerHTML=`<span class="lesson-badge">${done?"✓":(unlocked?(li+1):"🔒")}</span>
        <span class="lesson-name">${l.title}</span>`;
      row.onclick=()=>{if(unlocked)startLesson(l);};
      card.appendChild(row);
    });
    el.appendChild(card);
  });
}

/* ---------- PROFILE ---------- */
function renderProfile(){
  document.getElementById("pName").textContent=user.name;
  document.getElementById("pEmail").textContent=user.email;
  document.getElementById("pXp").textContent=user.xp;
  const milestones=user.milestones||[];
  document.getElementById("pMilestones").textContent=milestones.length;
  const log=document.getElementById("milestoneLog");
  if(!milestones.length){
    log.innerHTML='<p style="color:var(--ink-soft)">No moments yet — finish a lesson and try the mission tonight.</p>';
  } else {
    log.innerHTML=milestones.slice().reverse().slice(0,20).map(m=>
      `<div style="padding:8px 0;border-bottom:1px solid var(--line)">
        <span class="ar" lang="ar">${m.ar}</span> <span class="franco">(${m.franco})</span>
        <div style="color:var(--ink-soft);font-size:12px">${m.date}</div>
      </div>`
    ).join("");
  }
}

/* ---------- PHRASEBOOK ---------- */
function renderPhrasebook(){
  const list=document.getElementById("pbList");
  const learned=[];
  COURSE.units.forEach((u,ui)=>u.lessons.forEach((l,li)=>{
    if(isLessonUnlocked(ui,li))learned.push(...l.vocab);
  }));
  list.innerHTML="";
  if(!learned.length){
    list.innerHTML='<p style="padding:16px;color:var(--ink-soft)">Nothing unlocked yet — finish your first lesson.</p>';
    return;
  }
  learned.forEach(v=>{
    const row=document.createElement("div");
    row.style.cssText="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)";
    row.innerHTML=`
      <div>
        <div class="ar" lang="ar" style="font-size:20px">${v.ar}</div>
        <div class="franco">${v.franco}</div>
        <div style="color:var(--ink-soft);font-size:14px">${v.en}</div>
      </div>`;
    const btn=document.createElement("button");
    btn.className="audio-btn";
    btn.style.cssText="width:44px;height:44px;font-size:18px;margin:0";
    btn.setAttribute("aria-label","Play audio");
    btn.textContent="🔊";
    btn.onclick=()=>speak(v.ar);
    row.appendChild(btn);
    list.appendChild(row);
  });
}

/* ---------- EXERCISE BUILDING ---------- */
function buildExercises(vocab){
  const pool=allVocab();
  const list=[];

  vocab.forEach(item=>{
    // multiple choice: EN -> AR
    const distractors=shuffle(pool.filter(v=>v.ar!==item.ar)).slice(0,3);
    list.push({type:"mc",q:item.en,answer:item.ar,franco:item.franco,
      opts:shuffle([item.ar,...distractors.map(d=>d.ar)])});
  });

  vocab.forEach(item=>{
    // listen & choose: hear AR -> pick EN
    const distractors=shuffle(pool.filter(v=>v.en!==item.en)).slice(0,3);
    list.push({type:"listen",q:item.ar,answer:item.en,franco:item.franco,
      opts:shuffle([item.en,...distractors.map(d=>d.en)])});
  });

  vocab.forEach(item=>{
    // fill in the blank: type the Franco transliteration
    list.push({type:"fill",q:item.en,ar:item.ar,answer:item.franco});
  });

  if(vocab.length>=2){
    list.push({type:"match",pairs:shuffle(vocab).slice(0,Math.min(4,vocab.length))});
  }

  return shuffle(list);
}

/* ---------- LESSON RUNTIME ---------- */
function startLesson(lesson){
  curLesson=lesson;
  exList=buildExercises(lesson.vocab);
  exIdx=0;
  correctCount=0;
  document.getElementById("main").classList.add("hidden");
  document.getElementById("lesson").classList.remove("hidden");
  renderExercise();
}

function quitLesson(){
  if((exIdx>0||correctCount>0)&&!confirm("Quit this lesson? You'll lose your progress in it."))return;
  document.getElementById("lesson").classList.add("hidden");
  if(user&&user.isGuest){
    user=null;
    document.getElementById("auth").classList.remove("hidden");
  } else {
    document.getElementById("main").classList.remove("hidden");
    tab("learn");
  }
}

function updateProg(){
  const pct=Math.round((exIdx/exList.length)*100);
  document.getElementById("prog").style.width=pct+"%";
  document.getElementById("progbarEl").setAttribute("aria-valuenow",pct);
}

function renderExercise(){
  selection=null;matchState=null;
  updateProg();
  document.getElementById("fbArea").innerHTML="";
  document.getElementById("checkWrap").classList.remove("hidden");
  const checkBtn=document.getElementById("checkBtn");
  checkBtn.textContent="Check";
  checkBtn.disabled=true;
  checkBtn.onclick=check;
  const ex=exList[exIdx];
  const area=document.getElementById("exArea");
  area.innerHTML="";

  if(ex.type==="mc"){
    const q=document.createElement("div");q.className="q";q.textContent="Translate: \""+ex.q+"\"";
    area.appendChild(q);
    ex.opts.forEach(o=>{
      const b=document.createElement("button");
      b.className="opt ar";b.textContent=o;b.lang="ar";
      b.onclick=()=>selectOpt(b,o);
      area.appendChild(b);
    });
  } else if(ex.type==="listen"){
    const q=document.createElement("div");q.className="q";q.textContent="Listen and choose the meaning";
    area.appendChild(q);
    const audioBtn=document.createElement("button");
    audioBtn.className="audio-btn";audioBtn.textContent="🔊";
    audioBtn.setAttribute("aria-label","Play audio");
    if(!("speechSynthesis" in window)){
      audioBtn.disabled=true;
      audioBtn.title="Audio not supported on this device";
      const note=document.createElement("div");
      note.style.cssText="text-align:center;color:var(--ink-soft);font-size:13px";
      note.textContent="🔇 Audio not supported here — pick from the options below";
      area.appendChild(audioBtn);area.appendChild(note);
    } else {
      audioBtn.onclick=()=>speak(ex.q);
      area.appendChild(audioBtn);
    }
    ex.opts.forEach(o=>{
      const b=document.createElement("button");
      b.className="opt";b.textContent=o;
      b.onclick=()=>selectOpt(b,o);
      area.appendChild(b);
    });
    if("speechSynthesis" in window)speak(ex.q);
  } else if(ex.type==="fill"){
    const q=document.createElement("div");q.className="q";q.textContent="Type it in Franco-Arabic";
    area.appendChild(q);
    const sub=document.createElement("div");sub.style.padding="0 16px";
    sub.innerHTML=`<div class="ar" lang="ar" style="font-size:26px">${ex.ar}</div><div style="color:var(--ink-soft);margin-top:4px">${ex.q}</div>`;
    area.appendChild(sub);
    const fw=document.createElement("div");fw.className="fillwrap";
    const inp=document.createElement("input");
    inp.id="fillInput";inp.placeholder="e.g. Shukran";inp.autocomplete="off";
    inp.oninput=()=>{selection=inp.value;checkBtn.disabled=!inp.value.trim();};
    fw.appendChild(inp);area.appendChild(fw);
  } else if(ex.type==="match"){
    const q=document.createElement("div");q.className="q";q.textContent="Match the pairs";
    area.appendChild(q);
    const cols=document.createElement("div");cols.className="match-cols";
    const left=document.createElement("div");left.className="match-col";
    const right=document.createElement("div");right.className="match-col";
    const ens=ex.pairs.map(p=>p.en);
    const ars=shuffle(ex.pairs.map(p=>p.ar));
    matchState={matched:new Set(),selEn:null,selAr:null,pairs:ex.pairs};
    ens.forEach(en=>{
      const b=document.createElement("button");b.className="opt";b.style.fontSize="15px";b.textContent=en;
      b.dataset.en=en;
      b.onclick=()=>matchPick("en",en,b);
      left.appendChild(b);
    });
    ars.forEach(ar=>{
      const b=document.createElement("button");b.className="opt ar";b.lang="ar";b.style.fontSize="18px";b.textContent=ar;
      b.dataset.ar=ar;
      b.onclick=()=>matchPick("ar",ar,b);
      right.appendChild(b);
    });
    cols.appendChild(left);cols.appendChild(right);
    area.appendChild(cols);
    document.getElementById("checkWrap").classList.add("hidden");
  }
}

function selectOpt(btn,val){
  document.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel"));
  btn.classList.add("sel");
  selection=val;
  document.getElementById("checkBtn").disabled=false;
}

function matchPick(side,val,btn){
  if(btn.classList.contains("correct"))return;
  if(side==="en"){
    document.querySelectorAll('[data-en]').forEach(b=>b.classList.remove("sel"));
    matchState.selEn=val;btn.classList.add("sel");
  } else {
    document.querySelectorAll('[data-ar]').forEach(b=>b.classList.remove("sel"));
    matchState.selAr=val;btn.classList.add("sel");
  }
  if(matchState.selEn&&matchState.selAr){
    const pair=matchState.pairs.find(p=>p.en===matchState.selEn);
    const enBtn=document.querySelector(`[data-en="${CSS.escape(matchState.selEn)}"]`);
    const arBtn=document.querySelector(`[data-ar="${CSS.escape(matchState.selAr)}"]`);
    if(pair&&pair.ar===matchState.selAr){
      enBtn.classList.remove("sel");arBtn.classList.remove("sel");
      enBtn.classList.add("correct");arBtn.classList.add("correct");
      matchState.matched.add(matchState.selEn);
      matchState.selEn=null;matchState.selAr=null;
      if(matchState.matched.size===matchState.pairs.length){
        correctCount++;
        setTimeout(nextExercise,500);
      }
    } else {
      enBtn.classList.add("wrong");arBtn.classList.add("wrong");
      setTimeout(()=>{
        enBtn.classList.remove("sel","wrong");arBtn.classList.remove("sel","wrong");
        matchState.selEn=null;matchState.selAr=null;
      },500);
    }
  }
}

function normalize(s){return s.toLowerCase().replace(/['’]/g,"").trim();}

function check(){
  const ex=exList[exIdx];
  let ok=false;
  if(ex.type==="mc"||ex.type==="listen"){
    ok = selection===ex.answer;
    document.querySelectorAll(".opt").forEach(o=>{
      if(o.classList.contains("sel")){o.classList.add(ok?"correct":"wrong");o.insertAdjacentHTML("beforeend",ok?" ✓":" ✗");}
      if(!ok && (o.textContent.trim()===ex.answer)){o.classList.add("correct");o.insertAdjacentHTML("beforeend"," ✓");}
    });
  } else if(ex.type==="fill"){
    ok = normalize(selection||"")===normalize(ex.answer);
  }
  if(ok)correctCount++;
  showFeedback(ok,ex);
}

function showFeedback(ok,ex){
  const fb=document.getElementById("fbArea");
  const answerText = ex.type==="fill" ? `${ex.answer} (${ex.ar})` :
                      ex.type==="mc" ? `${ex.answer}${ex.franco?" — "+ex.franco:""}` :
                      ex.type==="listen" ? ex.answer : "";
  fb.innerHTML=`<div class="feedback ${ok?"fb-ok":"fb-no"}">
    <div class="fb-title">${ok?"Correct! ✅":"Not quite ❌"}</div>
    ${!ok?`<div>Answer: <b>${answerText}</b></div>`:""}
  </div>`;
  const checkBtn=document.getElementById("checkBtn");
  checkBtn.textContent="Continue";
  checkBtn.disabled=false;
  checkBtn.onclick=nextExercise;
}

function nextExercise(){
  exIdx++;
  document.getElementById("checkWrap").classList.remove("hidden");
  if(exIdx>=exList.length){finishAsSuccess();}
  else renderExercise();
}

function speak(text){
  if(!("speechSynthesis" in window))return;
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ar-EG";
  const voices=speechSynthesis.getVoices();
  const arVoice=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith("ar"));
  if(arVoice)u.voice=arVoice;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

let curMission=null;

function renderMission(){
  const box=document.getElementById("missionBox");
  curMission=curLesson.vocab[Math.floor(Math.random()*curLesson.vocab.length)];
  box.innerHTML=`<div style="font-weight:800;margin-bottom:8px">🎯 Tonight's mission</div>
    <div>Say this to them: <span class="ar" lang="ar" style="font-size:20px">${curMission.ar}</span>
    <span class="franco">(${curMission.franco})</span> — "${curMission.en}"</div>
    <button class="btn btn-blue" style="margin-top:12px" id="missionBtn" onclick="markMissionDone()">I said it! ✅</button>`;
}

function markMissionDone(){
  if(user&&!user.isGuest&&curMission){
    user.milestones=user.milestones||[];
    user.milestones.push({ar:curMission.ar,franco:curMission.franco,date:new Date().toISOString().slice(0,10)});
    saveUser();
    refreshTopBar();
  }
  const btn=document.getElementById("missionBtn");
  btn.textContent="Nice! 🎉";
  btn.disabled=true;
}

function finishAsSuccess(){
  const total=exList.length;
  const acc=Math.round((correctCount/total)*100);
  user.xp+=curLesson.xp;
  document.getElementById("dXp").textContent="+"+curLesson.xp;
  document.getElementById("dAcc").textContent=acc+"%";
  if(user.isGuest){
    document.getElementById("doneTitle").textContent="Nice! Sign up to save this progress";
  } else {
    user.progress[curLesson.id]={done:true,score:acc};
    saveUser();
    document.getElementById("doneTitle").textContent="Lesson Complete!";
  }
  renderMission();
  document.getElementById("lesson").classList.add("hidden");
  document.getElementById("done").classList.remove("hidden");
}

function finishLesson(){
  document.getElementById("done").classList.add("hidden");
  if(user&&user.isGuest){
    user=null;
    document.getElementById("auth").classList.remove("hidden");
  } else {
    document.getElementById("main").classList.remove("hidden");
    refreshTopBar();
    tab("learn");
  }
}

/* ---------- BOOTSTRAP ---------- */
(function init(){
  if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=()=>{};}
  const email=loadCurrentEmail();
  if(email){
    const users=loadUsers();
    const found=users.find(u=>u.email===email);
    if(found){user=found;enterApp();}
  }
})();
</script>
